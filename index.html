const qgGear=()=>{try{return JSON.parse(localStorage.getItem(QGEAR_KEY)||'{}')}catch(e){return {}}};
const qgSetGear=o=>{try{localStorage.setItem(QGEAR_KEY,JSON.stringify(o))}catch(e){}};
const qgSafe=h=>String(h||'').replace(/<(?!\/?(b|code|br)\b)[^>]*>/gi,'').replace(/^🚨\s*/,'');
const qgPlain=h=>qgSafe(h).replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/[ \t]+/g,' ').replace(/\n\s+/g,'\n').trim();
const qgTitle=t=>String(t).replace(/^\d+\.\s*/,'');
const qgLabel=t=>String(t||'').replace(/^[^一-鿿A-Za-z0-9]+/,'');
function qaHtml(a){
  return esc(a).replace(/\[([^\]]+)\]\(#([a-z]+)\)/g,'<a href="#$2" data-go="$2" style="color:var(--acc-t)">$1</a>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--acc-t)">$1</a>').replace(/\n/g,'<br>');
}
const QG_WX={
  sea:{sky:['#E4EFE9','#FFFFFF'],t:'雲海大景',d:'灰藍色雲層只聚在低處，700hPa 以上是乾淨的白色：頭頂晴朗、腳下是雲海。'},
  wall:{sky:['#D9D9D9','#EEEEEE'],t:'絕望白牆',d:'灰色或深藍色從低空一路連到 700hPa 以上：整座山被厚雲霧包住，沒有視野。'},
  storm:{sky:['#B9C3C9','#E3E8EA'],t:'午後雷雨',d:'上午雲很薄、下午雲像柱子往上暴長穿過 700hPa：熱對流旺盛，行程要在 11:00 前完成登頂並撤退。'}
};
function qgSceneState(st){return st.id==='weather-windy'?QG.wx:(st.wxState==='wall'?'wall':st.wxState==='storm'?'storm':'sunny')}
const qgNodeY=c=>60+(c.y-90)/300*170;   /* 站點在山脊帶（viewBox 900x260）上的高度 */
function qgSvg(G){
  const st=G.stations[QG.i],ws=qgSceneState(st);
  const sky=ws==='sunny'?['#F4F8F5','#FFFFFF']:QG_WX[ws].sky;
  const pts=G.stations.map(x=>x.coords.x+','+qgNodeY(x.coords).toFixed(0));
  const ridge='0,250 '+pts.join(' ')+' 900,250';
  let wx='';
  if(ws==='sea'||ws==='sunny')wx=`<path d="M0 205 Q60 188 130 200 T270 198 T420 206 T560 196 T720 208 T900 198 V260 H0Z" fill="#fff" opacity="${ws==='sea'?'.9':'.55'}"/>`;
  if(ws==='wall')wx='<rect width="900" height="260" fill="#D9D9D9" opacity=".78"/>';
  if(ws==='storm')wx='<g fill="#8E969B" opacity=".9"><ellipse cx="240" cy="40" rx="140" ry="30"/><ellipse cx="520" cy="24" rx="160" ry="30"/><ellipse cx="770" cy="46" rx="130" ry="28"/></g><path d="M520 50 L500 100 L524 100 L506 150 L556 90 L530 90 L548 50Z" fill="#E9CF79" stroke="#252525" stroke-width="2"/>';
  const hp=st.id==='weather-windy'?'<g><line x1="0" y1="92" x2="900" y2="92" stroke="#252525" stroke-width="2" stroke-dasharray="10 8"/><text x="12" y="84" font-size="22" font-weight="700" fill="#252525">700hPa（約 3,000m）</text></g>':'';
  const nodes=G.stations.map((x,k)=>{const a=k===QG.i,pd=k<QG.i,y=qgNodeY(x.coords);
    return `${a?`<circle class="qg-pulse" cx="${x.coords.x}" cy="${y}" r="16" fill="none" stroke="#E9CF79" stroke-width="5"/>`:''}<circle cx="${x.coords.x}" cy="${y}" r="15" fill="${a?'#E9CF79':pd?'#408467':'#fff'}" stroke="#252525" stroke-width="2.5"/><text x="${x.coords.x}" y="${y+6}" font-size="17" font-weight="800" text-anchor="middle" fill="${pd?'#fff':'#252525'}">${k+1}</text>`}).join('');
  return `<defs><linearGradient id="qgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
    <rect width="900" height="260" fill="url(#qgSky)"/>
    <polygon points="${ridge}" fill="#CFE3D7" stroke="#252525" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M${pts.join(' L')}" fill="none" stroke="#408467" stroke-width="5" stroke-dasharray="3 12" stroke-linecap="round" opacity=".0"/>
    ${wx}${hp}${nodes}`;
}
function qgStepper(G){
  const phases=[...new Set(G.stations.map(x=>x.phase))];
  return phases.map(ph=>`<div class="qg-ph"><div class="qg-ph-t">${esc(ph)}</div><div class="qg-chips">`+
    G.stations.map((x,k)=>x.phase!==ph?'':`<button class="qg-chip${k===QG.i?' on':''}" data-act="qaGo" data-i="${k}" ${k===QG.i?'aria-current="step"':''}><b>${k+1}</b><span>${esc(qgTitle(x.title))}</span></button>`).join('')+`</div></div>`).join('');
}
function qgCard(G){
  const st=G.stations[QG.i],last=QG.i===G.stations.length-1;
  const wxBox=st.id==='weather-windy'?`<div class="qg-wx" role="group" aria-label="切換天氣情境">${Object.entries(QG_WX).map(([k,v])=>`<button class="${QG.wx===k?'on':''}" data-act="qaWx" data-w="${k}" aria-pressed="${QG.wx===k}">${v.t}</button>`).join('')}</div><p class="qg-wxd">${QG_WX[QG.wx].d}</p>`:'';
  return `<div class="qg-card mtn">
    <div class="qg-tags"><span class="tag ok">${esc(st.phase)}</span>${st.qTags.map(t=>`<span class="tag" style="background:#F6EBC2">${esc(t)}</span>`).join('')}</div>
    <h3 class="qg-h">${esc(st.title)}</h3>
    <div class="src" style="margin:2px 0 8px">${esc(st.elev)}｜${esc(qgLabel(st.wxLabel))}</div>
    ${wxBox}
    <p class="qg-sum">${qgSafe(st.summary)}</p>
    ${st.cards.map(b=>`<div class="qg-bl mtn s"><h4>${esc(b.heading)}</h4><ul>${b.bullets.map(x=>`<li>${qgSafe(x)}</li>`).join('')}</ul></div>`).join('')}
    <details class="fold mtn s" style="margin-top:26px"><summary>展開這一站的完整 Q&A</summary><div class="foldin">${st.qaDetails.map(q=>`<div class="qg-qa"><b>${esc(q.q)}</b><div>${qgSafe(q.a)}</div></div>`).join('')}</div></details>
    <div class="qg-nav">
      <button data-act="qaGo" data-i="${QG.i-1}" ${QG.i===0?'disabled':''}>◀ 上一站</button>
      ${last?'<button class="pri" data-act="qaMode" data-m="lazy">看隨身懶人包 ▶</button>':`<button class="pri" data-act="qaGo" data-i="${QG.i+1}">下一站：${esc(qgTitle(G.stations[QG.i+1].title))} ▶</button>`}
    </div></div>`;
}
function qgGuide(G){
  const st=G.stations[QG.i];
  return `<div class="qg-prog"><span id="qgCnt">第 ${QG.i+1} / ${G.stations.length} 站</span><div class="bar"><i id="qgBar" style="width:${(QG.i+1)/G.stations.length*100}%"></i></div></div>
    <nav id="qgStep" aria-label="站點目錄">${qgStepper(G)}</nav>
    <div class="qg-ridge" id="qgRidge"><svg id="qgSvg" viewBox="0 0 900 260" role="img" aria-label="山脊上的 8 個站點，目前在第 ${QG.i+1} 站：${esc(qgTitle(st.title))}">${qgSvg(G)}</svg></div>
    <div class="qg-say mtn y" id="qgSay" aria-live="polite"><b>黑熊說</b>${esc(st.bearSpeech)}</div>
    <div id="qgCard">${qgCard(G)}</div>`;
}
function qgScrollTop(){
  const el=document.querySelector('#qaBody .qg-prog')||document.getElementById('qaBody');if(!el)return;
  const h=document.querySelector('header'),hh=h&&h.offsetHeight?h.offsetHeight:0;
  const y=el.getBoundingClientRect().top+window.pageYOffset-hh-8;
  window.scrollTo(0,Math.max(0,y));
  const box=document.getElementById('qgStep'),on=box&&box.querySelector('.qg-chip.on');if(box&&on)box.scrollLeft=on.offsetLeft-(box.clientWidth-on.offsetWidth)/2;
}
function qgPaint(){
  const G=window.QA_GUIDE;if(!G)return;const st=G.stations[QG.i];
  const g=id=>document.getElementById(id);if(!g('qgSvg'))return;
  g('qgSvg').innerHTML=qgSvg(G);g('qgSvg').setAttribute('aria-label','山脊上的 8 個站點，目前在第 '+(QG.i+1)+' 站：'+qgTitle(st.title));
  g('qgSay').innerHTML='<b>黑熊說</b>'+esc(st.bearSpeech);
  g('qgCnt').textContent='第 '+(QG.i+1)+' / '+G.stations.length+' 站';g('qgBar').style.width=((QG.i+1)/G.stations.length*100)+'%';
  g('qgStep').innerHTML=qgStepper(G);g('qgCard').innerHTML=qgCard(G);
  qgBearToNode();
}
function qgLazy(G){
  const gear=qgGear(),n=G.gear.filter(x=>gear[x.id]).length;
  return `<div class="qg-lazyh"><div><div class="eyebrow2">FIELD GUIDE</div><h3 class="qg-h" style="margin:0">隨身懶人包總整理</h3><p class="src" style="margin:4px 0 0">出發前打勾確認 8 大救命裝備，把申請時限、氣象判讀與急救口訣存進手機或印出帶上山。</p></div>
    <div class="row noprint"><button data-act="qaMode" data-m="guide">← 回到 8 站指南</button><button class="pri" data-act="qaCopy">複製文字傳隊友</button><button data-act="qaPrint">列印／存 PDF</button></div></div>
    ${G.lazy.map(b=>b.gear?`<section class="qg-blk mtn"><div class="hrow"><h4><i>${b.n}</i>${esc(b.title)}</h4><div class="row" style="gap:6px"><span class="tag" style="background:#E9CF79">${n} / ${G.gear.length}</span><button class="sm noprint" data-act="qaGearReset">重置</button></div></div>
      <p class="src">${qgSafe(b.intro)}</p><div class="gear">${G.gear.map(x=>`<label class="${gear[x.id]?'done':''}"><input type="checkbox" data-qgear="${x.id}" ${gear[x.id]?'checked':''}><span><b>${esc(x.name)}</b><small>${esc(x.desc)}</small></span></label>`).join('')}</div></section>`
      :`<section class="qg-blk mtn${b.alert?' y alert':''}"><h4><i>${b.n}</i>${esc(b.title)}</h4><ul>${b.items.map(x=>`<li>${qgSafe(x)}</li>`).join('')}</ul></section>`).join('')}`;
}
function qgSearch(G){
  const k=QG.q.trim().toLowerCase();const out=[];
  if(G)G.stations.forEach((st,i)=>{
    st.qaDetails.forEach(q=>{if((q.q+q.a).toLowerCase().includes(k))out.push({i,t:q.q,h:qgSafe(q.a)})});
    st.cards.forEach(c=>{const body=c.bullets.map(qgSafe).join('<br>');if((c.heading+qgPlain(body)).toLowerCase().includes(k))out.push({i,t:c.heading,h:'<ul style="margin:0;padding-left:18px">'+c.bullets.map(x=>'<li>'+qgSafe(x)+'</li>').join('')+'</ul>'})});
  });
  const app=(window.QA||[]).filter(x=>(x[1]+x[2]).toLowerCase().includes(k));
  const gl=out.map(x=>`<details class="fold mtn"><summary>${esc(x.t)}</summary><div class="foldin" style="line-height:1.75;font-size:14px">${x.h}<div style="margin-top:8px"><button class="sm" data-act="qaGo" data-i="${x.i}">到第 ${x.i+1} 站：${esc(qgTitle(G.stations[x.i].title))}</button></div></div></details>`).join('');
  const al=app.map(x=>`<details class="fold mtn"><summary>${esc(x[1])}</summary><div class="foldin" style="line-height:1.75;font-size:14px">${qaHtml(x[2])}</div></details>`).join('');
  if(!gl&&!al)return '<div class="note">沒有符合的題目，換個關鍵字試試。</div>';
  return `<div class="src" style="margin:4px 0">共 ${out.length+app.length} 筆結果</div>${gl?'<div class="sec-h">登山指南</div>'+gl:''}${al?'<div class="sec-h">小幫手用法</div>'+al:''}`;
}
function qgApp(){
  const L=window.QA||[];
  return `<div class="src" style="margin:4px 0">共 ${L.length} 題</div>`+L.map(x=>`<details class="fold mtn"><summary>${esc(x[1])}</summary><div class="foldin" style="line-height:1.75;font-size:14px">${qaHtml(x[2])}</div></details>`).join('');
}
/* ---------- 黑熊在 QA 周圍跑來跑去 ---------- */
const QB={x:0,y:0,dir:1,el:null,idle:null,sc:null,wt:null};
const qgReduce=()=>{try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
const qgBearEl=()=>document.getElementById('qgBear');
function qgRel(el){const w=document.getElementById('qaBody').getBoundingClientRect(),r=el.getBoundingClientRect();return {l:r.left-w.left,t:r.top-w.top,w:r.width,h:r.height,W:w.width}}
function qgBearMove(x,y){
  const b=qgBearEl();if(!b)return;
  const W=b.parentElement.getBoundingClientRect().width;x=Math.max(32,Math.min(W-32,x));
  if(x!==QB.x)QB.dir=x<QB.x?-1:1;
  QB.x=x;QB.y=y;b.style.setProperty('--f',QB.dir);b.style.transform='translate(calc('+x+'px - 50%),calc('+y+'px - 96%))';
  b.classList.add('walk');clearTimeout(QB.wt);QB.wt=setTimeout(()=>{b.classList.remove('walk');b.classList.remove('hop');void b.offsetWidth;b.classList.add('hop')},qgReduce()?0:900);
}
function qgNodePos(i){
  const G=window.QA_GUIDE,svg=document.getElementById('qgSvg');if(!G||!svg)return null;
  const c=G.stations[Math.max(0,Math.min(G.stations.length-1,i))].coords,r=qgRel(svg);
  return {x:r.l+c.x/900*r.w,y:r.t+qgNodeY(c)/260*r.h-6};
}
function qgBearToNode(){const p=qgNodePos(QG.i);if(!p)return;QB.el=null;qgBearMove(p.x,p.y)}
function qgBearToEl(el){
  if(!el||!qgBearEl())return;const r=qgRel(el);QB.el=el;
  let x=r.l+r.w*(0.15+Math.random()*0.7);if(Math.abs(x-QB.x)<70)x=r.l+r.w*(x>r.l+r.w/2?0.18:0.82);
  qgBearMove(x,r.t-4);
}
function qgBearInit(){
  const wrap=document.getElementById('qaBody');if(!wrap)return;
  let b=qgBearEl();if(b)b.remove();
  wrap.insertAdjacentHTML('beforeend','<div id="qgBear" class="qg-bear2" aria-hidden="true"><img src="'+IMG.bear+'" alt=""></div>');
  QB.x=wrap.getBoundingClientRect().width*0.2;QB.y=10;
  const first=wrap.querySelector('.mtn');
  if(QG.mode==='guide'&&!QG.q.trim()&&document.getElementById('qgSvg'))qgBearToNode();
  else if(first)qgBearToEl(first);
  qgIdleStart();
}
function qgIdleStart(){
  clearInterval(QB.idle);if(qgReduce())return;
  QB.idle=setInterval(()=>{
    if(tab!=='qa'||document.hidden||!qgBearEl())return;
    if(QB.el&&document.body.contains(QB.el)){const r=qgRel(QB.el);qgBearMove(r.l+r.w*(0.12+Math.random()*0.76),r.t-4)}
    else{const G=window.QA_GUIDE;if(!G)return;const j=QG.i+(Math.random()<.5?-1:1),p=qgNodePos(j);
      if(p&&j>=0&&j<G.stations.length){qgBearMove(p.x,p.y);setTimeout(()=>{if(!QB.el&&tab==='qa')qgBearToNode()},2400)}}
  },5600);
}
function qgStop(){clearInterval(QB.idle);QB.idle=null}
function qgOnScroll(){
  if(tab!=='qa'||!qgBearEl()||qgReduce())return;
  clearTimeout(QB.sc);
  QB.sc=setTimeout(()=>{
    const vh=window.innerHeight,els=[...document.querySelectorAll('#qaBody .mtn')];let best=null,bd=1e9;
    els.forEach(e=>{const r=e.getBoundingClientRect();if(r.bottom<90||r.top>vh-60)return;const d=Math.abs(r.top-vh*0.35);if(d<bd){bd=d;best=e}});
    const ridge=document.getElementById('qgRidge');
    if(ridge&&ridge.getBoundingClientRect().bottom>140&&QG.mode==='guide'&&!QG.q.trim()){qgBearToNode();return}
    if(best&&best!==QB.el)qgBearToEl(best);
  },450);
}
if(typeof window.addEventListener==='function'){window.addEventListener('scroll',qgOnScroll,{passive:true});
window.addEventListener('resize',()=>{clearTimeout(QB.wt);setTimeout(()=>{if(tab==='qa'&&qgBearEl()){if(QB.el&&document.body.contains(QB.el))qgBearToEl(QB.el);else qgBearToNode()}},250)});}
function qaBodyRender(){
  const el=document.getElementById('qaBody');if(!el)return;
  const G=window.QA_GUIDE;
  if(!G||!window.QA){el.innerHTML='<div class="note">'+(_qaFail?'找不到 QA 資料，請確認 hiking-planner.html 是最新版（可執行 工具\\更新QA.bat）。':'載入中…')+'</div>';return}
  document.querySelectorAll('#qaTabs button').forEach(b=>{const on=b.dataset.m===QG.mode&&!QG.q.trim();b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  if(QG.q.trim()){el.innerHTML=qgSearch(G)}
  else el.innerHTML=QG.mode==='guide'?qgGuide(G):QG.mode==='lazy'?qgLazy(G):qgApp();
  qgBearInit();
}
function qaRefresh(){
  qaBodyRender();
  if((window.QA_GUIDE&&window.QA)||_qaLoading)return;_qaLoading=true;
  const sc=document.createElement('script');sc.src='qa-data.js';
  sc.onload=()=>{_qaLoading=false;qaBodyRender()};
  sc.onerror=()=>{_qaLoading=false;_qaFail=true;qaBodyRender()};
  document.head.appendChild(sc);
}
function qgToggleGear(id,on){const g=qgGear();if(on)g[id]=1;else delete g[id];qgSetGear(g);qaBodyRender()}
function qgCopyText(G){
  const gear=qgGear();let t='【登山隨身懶人包】\n';
  G.lazy.forEach(b=>{t+='\n'+b.n+'. '+b.title+'\n';
    if(b.gear){t+=qgPlain(b.intro)+'\n';G.gear.forEach(x=>{t+=(gear[x.id]?'☑ ':'☐ ')+x.name+'：'+x.desc+'\n'})}
    else b.items.forEach(x=>{t+='• '+qgPlain(x)+'\n'})});
  return t+'\n※ 一般性提醒，各路線規定以主管機關公告為準。';
}
function vQA(t){
  return `<section class="card"><div style="display:flex;align-items:center;gap:12px"><div style="width:64px;flex:none">${aniSvg('goat')}</div><div><h2 style="margin:0">QA 知識庫</h2><div class="note">登山前、中、後該知道的事，和小幫手的用法。</div></div></div>
    <input id="qaQ" type="search" placeholder="搜尋，例如：入山證、700hPa、高山症、STOP" value="${esc(QG.q)}" autocomplete="off" style="margin-top:10px">
    <div class="qg-tabs" id="qaTabs" role="tablist"><button data-act="qaMode" data-m="guide" role="tab">登山指南 8 站</button><button data-act="qaMode" data-m="lazy" role="tab">隨身懶人包</button><button data-act="qaMode" data-m="app" role="tab">小幫手用法</button></div></section>
    <div id="qaBody"></div>
    <div class="src" style="text-align:center;margin:8px 0">登山知識為一般性提醒，不是專業指導；申請時限與各路線規定常會調整，請以主管機關公告為準。</div>`;
}
function vLinks(emoji,title,ani,intro,groups,extra){
  return `<section class="card"><div style="display:flex;align-items:center;gap:12px"><div style="width:64px;flex:none">${aniSvg(ani)}</div><div><h2 style="margin:0">${emoji} ${title}</h2><div class="note">${intro}</div></div></div></section>${extra||''}`+
   groups.map(g=>`<section class="card"><h2>${g[0]}</h2>${g[1].map(x=>`<a class="lk" href="${x[1]}" target="_blank" rel="noopener"><b>${esc(x[0])}</b><div class="note">${esc(x[2]||'')}</div></a>`).join('')}</section>`).join('');
}
function vWxLinks(t){
  const ex=`<section class="card"><h2>用行程座標查詢</h2>
    <a class="lk" href="https://www.windy.com/${t.lat}/${t.lon}?${t.lat},${t.lon},9" target="_blank" rel="noopener"><b>🌬 Windy：${esc(t.name)} 附近</b><div class="note">看風向、風速、雲、雨（座標 ${t.lat}, ${t.lon}）</div></a>
    <button data-go="wx" style="width:100%">📈 行程期間預報（溫度／風／雨）</button></section>`;
  return vLinks('🌤','天氣觀測','muntjac','出發前多看幾個來源，彼此對照。',[['氣象網站',[
    ['NCDR 天氣監測','https://watch.ncdr.nat.gov.tw/watch_tfrain_fst','降雨、颱風、預報'],
    ['中央氣象局','https://ppt.cc/fg33Zx','官方預報與特報'],
    ['WINDY','https://ppt.cc/f392Qx','風、雲、雨圖層，看風向最直覺']]],

  return `<div id="snapCard" class="snap"><div class="sn-h">⛰ ${esc(t.name)}</div>
   <div class="sn-m">${fmtDate(t.date)} 出發｜${nd} 天｜${t.people} 人｜倍率 ×${t.mult}</div>
   <div class="sn-b">🏁 預計下山 ${fmtDate(addDays(t.date,nd-1))} ${hm(last.end)}</div>
   <div class="sn-m">☀ ${hm(s1.rise)}　🌇 ${hm(s1.set)}（第 1 天）${t.contact?`<br>📞 緊急聯絡：${esc(t.contact)}`:''}${t.permit?`<br>🪪 入園證：${esc(t.permit)}`:''}</div>

}

  });

  Object.keys(adj).forEach(n=>{if(/登山口|入口|停車場|行車終點/.test(n))heads.add(n)});
  const leaves=Object.keys(adj).filter(n=>adj[n].length===1);

async function getWx(){
  const t=cur(),nd=dayCount(t),end=addDays(t.date,nd-1);wx=null;wxMsg='載入中…';render();
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${t.lat}&longitude=${t.lon}&elevation=${t.elev}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max&wind_speed_unit=ms&timezone=Asia%2FTaipei&start_date=${t.date}&end_date=${end}`;
    let r;
    try{r=await fetch(u)}catch(e){throw new Error('連不上氣象服務（Open-Meteo）。可能是網路被擋、離線，或在 LINE／內嵌瀏覽器內被限制。請改用下方「官方氣象資料」，或換用 Chrome／Safari 開啟。')}
    const j=await r.json();
    if(!r.ok||j.error)throw new Error((j.reason||'無法取得預報')+'（預報只提供未來約 16 天內的日期）');
    wx=j.daily;wxMsg='';
  }catch(e){wxMsg=String(e.message||e)}
  render();
}

  const a=e.target.closest('#tripbar [data-act]');if(a)act(a.dataset.act,a)});
document.addEventListener('change',e=>{
  const el=e.target,t=cur();
  if(el.id==='tripSel'){S.cur=el.value}
  else if(el.id==='shMapSel'){shMap=el.value}
  else if(el.dataset.t){const f=el.dataset.t;t[f]=el.dataset.bool?el.checked:el.dataset.num?(+el.value||0):el.value}
  else if(el.dataset.f){const n=t.nodes[+el.dataset.i],f=el.dataset.f;n[f]=(f==='night'||f==='fixed')?el.checked:el.dataset.num?(+el.value||0):el.value}
  else if(el.dataset.hm){const n=t.nodes[+el.dataset.i],row=el.closest('.node');const h=+row.querySelector('[data-hm=h]').value||0,m=+row.querySelector('[data-hm=m]').value||0;n.min=Math.max(0,h*60+m)}
  else if(el.dataset.s){t.starts[el.dataset.s]=el.value||'04:00'}
  else if(el.dataset.k){t.checks[el.dataset.k]=el.checked}
  else if(el.dataset.m){t.meals[el.dataset.m]=el.checked}
  else return;
  save();render();
});
document.addEventListener('input',e=>{if(e.target.id==='itinTxt'){UI.itinTxt=e.target.value;return}if(e.target.id==='qaQ'){QG.q=e.target.value;qaBodyRender();return}if(e.target.id==='trQ'){TQ.q=e.target.value;TQ.n=30;trRefresh();return}if(e.target.id==='tplQ'){const l=document.getElementById('tplList');if(l)l.innerHTML=tplCards(e.target.value)}});
window.addEventListener('hashchange',()=>{tab=readTab();render()});
render();
initLiff();
</script>
</body>
